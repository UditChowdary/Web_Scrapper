<div class="dependency-container">
  <div class="header">
    <button class="back-button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Dependency Chain for {{ repoFullName }}</h1>
  </div>
  <div *ngIf="isLoading" class="spinner-container">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>
  <div *ngIf="!isLoading">
    <div *ngIf="!dependencies || dependencies.length === 0" class="no-dependencies">
      Unable to retrieve dependency list.
    </div>
    <div *ngIf="dependencies && dependencies.length > 0" class="graph-container">
      <ngx-graph
        [nodes]="nodes"
        [links]="links"
        [layout]="'dagre'"
        [layoutSettings]="{ orientation: 'LR' }"
      >
        <ng-template #nodeTemplate let-node>
          <svg:g class="node" (click)="onNodeClick(node)" style="cursor: pointer;">
            <svg:rect [attr.width]="node.dimension.width" [attr.height]="node.dimension.height" [attr.fill]="'#007bff'" [attr.stroke]="'#0056b3'" [attr.rx]="3" [attr.ry]="3"/>
            <svg:text alignment-baseline="central" [attr.x]="node.dimension.width / 2" [attr.y]="node.dimension.height / 2" [attr.fill]="'white'" text-anchor="middle">
              {{ node.label }}
            </svg:text>
          </svg:g>
        </ng-template>
      </ngx-graph>
    </div>
  </div>
</div>
